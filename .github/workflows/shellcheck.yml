name: shellcheck

# The plugin ships an executable (bin/alfred-wake) that runs unattended inside
# every lead's devbox pod. A lint regression there is silent until a lead stops
# being woken, so it is gated here rather than trusted to review.
#
# GitHub-hosted runners only: this repo is public, and public repos are blocked
# from the org's self-hosted runner pool.

on:
  pull_request:
    paths:
      - 'bin/**'
      - 'hooks/**'
      - 'themes/**'
      - '.claude-plugin/**'
      - 'tests/**'
      - '.github/workflows/shellcheck.yml'
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'hooks/**'
      - 'themes/**'
      - '.claude-plugin/**'
      - 'tests/**'
      - '.github/workflows/shellcheck.yml'

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck version
        run: shellcheck --version

      - name: Lint shipped scripts and test helpers
        run: shellcheck bin/* hooks/*.sh tests/stub/*

      - name: Syntax check
        run: |
          for f in bin/*; do
            bash -n "$f"
          done

      - name: Plugin JSON parses (manifest, hooks, themes)
        run: |
          status=0
          for f in .claude-plugin/plugin.json hooks/hooks.json themes/*.json; do
            [ -e "$f" ] || continue
            jq -e 'type == "object"' "$f" >/dev/null || { echo "::error file=$f::not a JSON object"; status=1; }
          done
          for f in themes/*.json; do
            [ -e "$f" ] || continue
            jq -e '(.overrides // {}) | type == "object"' "$f" >/dev/null || { echo "::error file=$f::overrides must be an object"; status=1; }
          done
          exit $status

      - name: Scripts must be executable and free of `set -x`
        run: |
          status=0
          for f in bin/*; do
            if [ ! -x "$f" ]; then
              echo "::error file=$f::not executable — the plugin ships it as a command"
              status=1
            fi
            if grep -qE '^\s*set\s+-[a-z]*x' "$f"; then
              echo "::error file=$f::contains 'set -x' — it would trace secrets into the session log"
              status=1
            fi
          done
          exit $status

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: sudo apt-get update -q && sudo apt-get install -y -q bats

      - name: Behaviour tests (stubbed agent-messaging, no network)
        run: bats tests/
