name: shellcheck

# The plugin ships an executable (bin/alfred-wake) that runs unattended inside
# every lead's devbox pod. A lint regression there is silent until a lead stops
# being woken, so it is gated here rather than trusted to review.
#
# GitHub-hosted runners only: this repo is public, and public repos are blocked
# from the org's self-hosted runner pool.

on:
  pull_request:
    paths:
      - 'bin/**'
      - 'hooks/**'
      - 'config/**'
      - 'agreement/**'
      - 'rules/**'
      - 'themes/**'
      - '.claude-plugin/**'
      - 'tests/**'
      - 'templates/**'
      - '.github/workflows/shellcheck.yml'
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'hooks/**'
      - 'config/**'
      - 'agreement/**'
      - 'rules/**'
      - 'themes/**'
      - '.claude-plugin/**'
      - 'tests/**'
      - 'templates/**'
      - '.github/workflows/shellcheck.yml'

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck version
        run: shellcheck --version

      - name: Lint shipped scripts and test helpers
        run: shellcheck bin/* hooks/*.sh tests/stub/*

      # A syntax error in a hook exits 2, which Claude Code reads as a block,
      # so every shipped script and hook is parsed here, not only linted.
      - name: Syntax check
        run: |
          for f in bin/* hooks/*.sh; do
            bash -n "$f"
          done

      # Hook-mode scripts must fail open: no `set -e`/`set -u`, and no exit
      # code other than 0 outside the lines marked `# cli-only` (an exit 2
      # from a Stop hook blocks the stop). ccplugin#127.
      - name: Hook exit-code audit
        run: |
          status=0
          for f in hooks/stop.sh bin/alfred-loop-check hooks/reply-timestamp.sh lib/owner-turn.sh; do
            if grep -nE '^\s*set\s+-[a-z]*[eu]' "$f"; then
              echo "::error file=$f::hook-mode script must not use set -e or set -u"
              status=1
            fi
            bad=$(grep -nE '\bexit +[1-9]' "$f" | grep -v 'cli-only' || true)
            if [ -n "$bad" ]; then
              echo "::error file=$f::non-zero exit outside a cli-only line: $bad"
              status=1
            fi
          done
          exit $status

      - name: Plugin JSON parses (manifest, hooks, themes)
        run: |
          status=0
          for f in .claude-plugin/plugin.json hooks/hooks.json themes/*.json; do
            [ -e "$f" ] || continue
            jq -e 'type == "object"' "$f" >/dev/null || { echo "::error file=$f::not a JSON object"; status=1; }
          done
          for f in themes/*.json; do
            [ -e "$f" ] || continue
            jq -e '(.overrides // {}) | type == "object"' "$f" >/dev/null || { echo "::error file=$f::overrides must be an object"; status=1; }
          done
          exit $status

      - name: Scripts must be executable and free of `set -x`
        run: |
          status=0
          for f in bin/*; do
            if [ ! -x "$f" ]; then
              echo "::error file=$f::not executable — the plugin ships it as a command"
              status=1
            fi
            if grep -qE '^\s*set\s+-[a-z]*x' "$f"; then
              echo "::error file=$f::contains 'set -x' — it would trace secrets into the session log"
              status=1
            fi
          done
          exit $status

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: sudo apt-get update -q && sudo apt-get install -y -q bats

      - name: Behaviour tests (stubbed agent-messaging, no network)
        run: bats tests/
